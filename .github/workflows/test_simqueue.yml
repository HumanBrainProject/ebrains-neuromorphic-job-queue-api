name: Test simqueue API

on:
  push:
    branches: [ "master", "staging" ]
  pull_request:
    branches: [ "master", "staging" ]

permissions:
  contents: read

jobs:
  test-stable:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements.txt.lock
        pip install -r api/requirements_testing.txt
    - name: Lint with ruff
      run: |
        ruff check api/simqueue
    - name: Test with pytest
      run: |
        cd api
        pytest --cov=simqueue --cov-report=term

  test-latest:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements.txt
        pip install -r api/requirements_testing.txt
    - name: Lint with ruff (advisory)
      run: |
        ruff check api/simqueue || true
    - name: Test with pytest
      run: |
        cd api
        pytest --cov=simqueue --cov-report=term

  build-docs:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install Sphinx
      run: |
        python -m pip install --upgrade pip
        pip install sphinx
    - name: Build developer guide
      run: |
        sphinx-build -W -b html documentation/developer_guide /tmp/docs-html
